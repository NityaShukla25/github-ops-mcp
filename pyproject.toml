[project]
name = "github-ops-mcp"
version = "0.1.0"
description = "MCP server for GitHub/git operations via gh + git CLIs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
github-ops-mcp = "github_ops_mcp.server:main"
